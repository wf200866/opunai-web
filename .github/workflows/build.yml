name: Build Opunai Frontend

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'new-api tag'
        required: false
        default: 'v1.0.0-rc.48'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Fetch new-api source
        run: |
          REF="${{ github.event.inputs.ref }}"
          if [ -z "$REF" ]; then REF="v1.0.0-rc.48"; fi
          echo "Fetching new-api @ $REF"
          mkdir -p src
          curl -fL --retry 3 --max-time 300 \
            "https://codeload.github.com/QuantumNous/new-api/tar.gz/refs/tags/${REF}" \
            -o src.tgz
          tar -xzf src.tgz -C src --strip-components=1
          ls src
          test -d src/web

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Opunai patches
        run: |
          cd src/web
          echo "=== web 目录 ==="
          ls
          WS="${GITHUB_WORKSPACE:-/home/runner/work/opunai-web/opunai-web}"
          if [ -f "$WS/patch/apply.sh" ]; then
            echo "=== 应用 patch ==="
            sh "$WS/patch/apply.sh" "$PWD"
          else
            echo "no custom patch"
          fi

      - name: Install dependencies
        run: |
          cd src/web
          npm install --no-audit --no-fund
          echo "=== node_modules ==="
          ls node_modules | wc -l

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          cd src/web
          node -e "console.log(JSON.stringify(require('./package.json').scripts,null,2))"
          npm run build
          echo "=== dist ==="
          ls -la dist | head -20
          du -sh dist

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: new-api-dist
          path: src/web/dist
          retention-days: 7
          if-no-files-found: error