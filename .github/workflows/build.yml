name: Build Opunai Frontend

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'new-api tag'
        required: false
        default: 'v1.0.0-rc.48'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Fetch new-api source
        run: |
          REF="${{ github.event.inputs.ref }}"
          if [ -z "$REF" ]; then REF="v1.0.0-rc.48"; fi
          echo "Fetching new-api @ $REF"
          mkdir -p src
          curl -fL --retry 3 --max-time 300 \
            "https://codeload.github.com/QuantumNous/new-api/tar.gz/refs/tags/${REF}" \
            -o src.tgz
          tar -xzf src.tgz -C src --strip-components=1
          test -d src/web

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fix package.json overrides
        run: |
          cd src/web
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            if (p.overrides) { console.log('REMOVING overrides:', JSON.stringify(p.overrides)); delete p.overrides; }
            fs.writeFileSync('package.json', JSON.stringify(p,null,2));
            console.log('scripts:', JSON.stringify(p.scripts));
          "

      - name: Apply Opunai patches
        run: |
          cd src/web
          WS="${GITHUB_WORKSPACE}"
          if [ -f "$WS/patch/apply.sh" ]; then
            sh "$WS/patch/apply.sh" "$PWD"
          else
            echo "no custom patch"
          fi

      - name: Install dependencies
        run: |
          cd src/web
          npm install --no-audit --no-fund --legacy-peer-deps
          echo "=== node_modules ==="
          ls node_modules | wc -l

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          cd src/web
          npm run build
          echo "=== dist ==="
          ls -la dist | head -20
          du -sh dist

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: new-api-dist
          path: src/web/dist
          retention-days: 7
          if-no-files-found: error