name: Build Opunai Frontend

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'new-api tag/branch'
        required: false
        default: 'v1.0.0-rc.48'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Fetch new-api source
        run: |
          set -e
          REF="${{ github.event.inputs.ref || 'v1.0.0-rc.48' }}"
          echo "Fetching new-api @ $REF"
          mkdir -p src
          curl -fL --retry 3 --max-time 300 \
            "https://codeload.github.com/QuantumNous/new-api/tar.gz/refs/tags/${REF}" \
            -o src.tgz || \
          curl -fL --retry 3 --max-time 300 \
            "https://codeload.github.com/QuantumNous/new-api/tar.gz/refs/heads/${REF}" \
            -o src.tgz
          tar -xzf src.tgz -C src --strip-components=1
          ls src
          test -d src/web

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Apply Opunai patches
        run: |
          set -e
          cd src/web
          echo "=== 当前 web 结构 ==="
          ls
          if [ -f /home/runner/work/opunai-web/opunai-web/patch/apply.sh ]; then
            echo "=== 应用自定义 patch ==="
            sh /home/runner/work/opunai-web/opunai-web/patch/apply.sh "$PWD"
          else
            echo "no custom patch"
          fi

      - name: Install dependencies
        run: |
          cd src/web
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          echo "=== node_modules ==="
          ls node_modules | wc -l

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          cd src/web
          cat package.json | head -40
          npm run build
          echo "=== dist ==="
          ls -la dist | head -20
          du -sh dist

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: new-api-dist
          path: src/web/dist
          retention-days: 7
          if-no-files-found: error
